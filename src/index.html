<body>
	<select id="type">
		<option>Sine</option>
		<option>Square</option>
		<option>Sawtooth</option>
		<option>Triangle</option>
	</select>
	<div id="btn"></div>
	<div>
		<input type="checkbox" id="v" onclick="iu()" checked />
		<label for="v">Velocity</label>
	</div>

	<script>
		let midi = null;
		let velocity_enabled = true;
		function iu() {
			velocity_enabled = document.getElementById("v").checked;
		}

		function onMIDIMessage(event) {
			const [status, note, velocity] = event.data;
			const messageType = status & 0xf0;
			const frequency = 440 * 2 ** ((note - 69) / 12);

			if (messageType === 0x90 && velocity > 0) {
				startSound(frequency, note, velocity);
			} else if (
				messageType === 0x80 ||
				(messageType === 0x90 && velocity === 0)
			) {
				stopSound(note);
			}
		}

		function startLoggingMIDIInput(midiAccess) {
			midiAccess.inputs.forEach((entry) => {
				entry.onmidimessage = onMIDIMessage;
			});
		}

		function onMIDISuccess(midiAccess) {
			console.log("MIDI ready!");
			midi = midiAccess;
			startLoggingMIDIInput(midi);
		}

		function onMIDIFailure(msg) {
			console.error(`Failed to get MIDI access - ${msg}`);
		}

		navigator.requestMIDIAccess().then(onMIDISuccess, onMIDIFailure);

		let button_data_note = '</button><button data-note="';
		let children = "";
		for (let i = 1; i < 4; i++) {
			children +=
				'<button data-note="' +
				261.63 * 2 ** i +
				'">C' +
				button_data_note +
				293.66 * 2 ** i +
				'">D' +
				button_data_note +
				329.63 * 2 ** i +
				'">E' +
				button_data_note +
				349.23 * 2 ** i +
				'">F' +
				button_data_note +
				392.0 * 2 ** i +
				'">G' +
				button_data_note +
				440.0 * 2 ** i +
				'">A' +
				button_data_note +
				493.88 * 2 ** i +
				'">B</button>';
		}
		document.getElementById("btn").innerHTML = children;

		let audio;
		const activeSounds = new Map();

		function startSound(frequency, soundKey, velocity = 127) {
			audio ??= new AudioContext();
			audio.resume();

			const oscillator = audio.createOscillator();
			const gain = audio.createGain();
			const currentTime = audio.currentTime;

			oscillator.type = document
				.getElementById("type")
				.value.toLowerCase();

			oscillator.frequency.value = frequency;

			gain.gain.setValueAtTime(0.0001, currentTime);
			gain.gain.exponentialRampToValueAtTime(
				velocity_enabled ? (velocity / 127) * 0.25 : 0.25,
				currentTime + 0.02,
			);

			oscillator.connect(gain);
			gain.connect(audio.destination);
			oscillator.start();

			activeSounds.set(soundKey, { oscillator, gain });
		}

		function stopSound(soundKey) {
			const sound = activeSounds.get(soundKey);
			if (!sound) return;

			const currentTime = audio.currentTime;

			sound.gain.gain.cancelScheduledValues(currentTime);
			sound.gain.gain.setValueAtTime(
				Math.max(sound.gain.gain.value, 0.0001),
				currentTime,
			);
			sound.gain.gain.exponentialRampToValueAtTime(
				0.0001,
				currentTime + 0.05,
			);

			sound.oscillator.stop(currentTime + 0.06);
			activeSounds.delete(soundKey);
		}

		document.querySelectorAll("button").forEach((button) => {
			const frequency = Number(button.dataset.note);

			button.addEventListener("pointerdown", () => {
				startSound(frequency, button, 127);
			});

			button.addEventListener("pointerup", () => {
				stopSound(button);
			});

			button.addEventListener("pointerleave", () => {
				stopSound(button);
			});

			button.addEventListener("pointercancel", () => {
				stopSound(button);
			});
		});
	</script>
</body>
